# Directory to run the server from. The world data and server configs will be stored here
# Default: null
# RootPath =

# Logging level for the server. Options are: All, Trace, Debug, Info, Warn, Error, Fatal, Off
# Default : Debug
# LogLevel =

# Maximum number of players that can be connected at the same time
# Default: 20
# MaxPlayers = 20

# Server description shown to players in the server browser
# Default: null
# Description =

# Removes the allowlist check on player connections. Allows any player to join the server
# Default: false
PublicServer = false

# Disable the TLS port
# Default: false
DisableTls = false

# Enable the unencrypted TCP port
# Default: false
EnableRawTcp = false

# Path to the TLS certificate file
# Default: null
# CertPath =

# Path to the TLS private key file
# Default: null
# KeyPath =

# DNS clients require a publicly trusted certificate matching the server name.
# Literal IP clients use encrypted TLS without certificate identity verification,
# so the generated certificate works for direct-IP connections.

# Public TLS host-and-port contexts accepted by Identity tickets.
# Configure JSON or environment array syntax for multiple public aliases.
# Example: PublicServerContexts:0 = play.example.com:36676
# Default: empty (authenticated joins fail closed)
# PublicServerContexts:0 =

# Absolute HTTPS Identity-service JWKS endpoint used to verify multiplayer tickets
# Default: https://craftdig.io/.well-known/jwks.json
# IdentityJwksUrl =

# Maximum average presence bytes queued per second across all clients.
# Output is paced in fair round-robin order with a small token-bucket burst.
# Default: 20000000
# PresenceEgressBytesPerSecond =
